name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Muc 17: huy run cu khi push moi len cung branch (tiet kiem minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt
          mkdir -p data && ls -la data || true
          python -c "import duckdb; print('duckdb', duckdb.__version__)"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check formatting with black
        run: |
          black --check --diff --line-length=120 .

      - name: Check import ordering with isort
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          isort --check-only --diff --line-length=120 .

      - name: Test with pytest and coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term --cov-fail-under=40 -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm --prefix frontend install
      # Muc 17: typecheck bat buoc (dang xanh); test/build giu lenient ke ca flaky env
      - run: pnpm --prefix frontend --filter @app/shared typecheck
      - run: pnpm --prefix frontend --filter @app/web typecheck
      - run: pnpm --prefix frontend --filter @app/shared test || true
      - run: pnpm --prefix frontend -r build || true

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Muc 17: validate compose truoc khi build de bat loi config som
      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: dataworkbench-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: dataworkbench-frontend:latest
