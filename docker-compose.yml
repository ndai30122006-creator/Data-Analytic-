# ═══════════════════════════════════════════════════════════════════
# Learning Analytics Thống kê — Docker Compose
#
#   Dev  : docker compose up --build
#   Prod : docker compose --profile production up --build -d
#
# Cấu hình bí mật được đọc từ file .env (giống .env.example).
# Yêu cầu Compose v2.24+ (Docker Desktop 4.30+ / Docker Engine 25+).
# ═══════════════════════════════════════════════════════════════════

services:
  # ── FastAPI Backend ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: workbench-ai-backend:latest
    container_name: wb-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      # Lưu DB vào Docker volume → dữ liệu không mất khi recreate container
      DATABASE_URL: sqlite:////app/data/users.db
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - app-network

  # ── Web Frontend (Nginx serving web+mobile) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: workbench-ai-frontend:latest
    container_name: wb-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ── Nginx Reverse Proxy (chỉ chạy với profile production) ──
  nginx:
    image: nginx:alpine
    container_name: wb-nginx
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  app_data:

networks:
  app-network:
    driver: bridge